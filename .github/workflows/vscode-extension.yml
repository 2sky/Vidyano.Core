# Compiles the VS Code extension so a breaking dependency bump (e.g. Dependabot) fails its PR.
name: VS Code extension

on:
  push:
    branches: [main]
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode-extension.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - run: npm run compile
